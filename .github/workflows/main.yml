name: Update RFI episodes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rfi:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch RFI metadata
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          url = "https://apis.fle.rfi.fr/products/get_product/fle_getpodcast_by_nid_author_rfi?token_application=applepodcast_fle&program.entrepriseId=WBMZ39-FLE-FR-20220627"

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as r:
              raw = r.read()

          root = ET.fromstring(raw)
          channel = root.find("channel")

          episodes = []

          if channel is not None:
              for item in channel.findall("item")[:20]:
                  def get(tag):
                      el = item.find(tag)
                      return el.text.strip() if el is not None and el.text else ""

                  episodes.append({
                      "title": get("title"),
                      "pubDate": get("pubDate"),
                      "officialUrl": get("link")
                  })

          Path("data").mkdir(exist_ok=True)

          with open("data/rfi.json", "w", encoding="utf-8") as f:
              json.dump({
                  "source": "RFI — Journal en français facile",
                  "episodes": episodes
              }, f, ensure_ascii=False, indent=2)

          print("Episodes found:", len(episodes))
          PY

      - name: Save RFI metadata
        run: |
          git config user.name "French Zero"
          git config user.email "actions@users.noreply.github.com"
          git add data/rfi.json
          git diff --cached --quiet || git commit -m "Update RFI metadata"
          git push
